<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BAR Menu Study</title>
  <meta name="description" content="BARのドリンクメニューを覚えるための個人用学習アプリ">
  <meta name="theme-color" content="#0d0b09">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BAR学習">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="appbar">
    <button class="icon-btn" id="backBtn" type="button" aria-label="戻る" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="appbar-title" id="appTitle">メニュー</h1>
    <div class="appbar-actions">
      <a class="icon-btn" href="#/search" aria-label="検索">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </a>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="データ更新">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="メインメニュー">
    <a href="#/menu" data-tab="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14l-7 8z"/><path d="M12 12v7"/><path d="M8 20h8"/></svg>
      <span>メニュー</span>
    </a>
    <a href="#/cards" data-tab="cards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3.5" width="12" height="15" rx="1.5"/><path d="M4 7v12.5A1.5 1.5 0 0 0 5.5 21H15"/></svg>
      <span>カード</span>
    </a>
    <a href="#/quiz" data-tab="quiz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.7"/><circle cx="12" cy="17" r=".6"/></svg>
      <span>クイズ</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12"/><path d="M12 20V5"/><path d="M19 20v-9"/></svg>
      <span>進捗</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
